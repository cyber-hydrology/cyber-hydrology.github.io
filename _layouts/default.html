<!DOCTYPE html>
<html>

  {% include head.html %}

  <body>

    {% include header.html %}

    <div class="container-fluid">
      <div class="row">
        {{ content }}
      </div>
    </div>

    {% include footer.html %}
    
    <script>
    function toggleMemberDetail(nameEl) {
      const infoBox = nameEl.closest('.col-sm-6');
      const panel = infoBox.querySelector('.member-detail-panel');
      if (!panel) return;
      if (panel.classList.contains('open')) {
        panel.classList.remove('open');
        nameEl.classList.remove('open');
      } else {
        panel.classList.add('open');
        nameEl.classList.add('open');
      }
    }
    </script>
    
  </body>

</html>
